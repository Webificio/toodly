# Builds the toodly installers on Windows, macOS and Linux (cross-compiling is not possible:
# each platform must be built on its own operating system).
# Start: Actions tab → "Build installer" → Run workflow (the v* tag trigger is currently commented out below).
# When re-enabled, a v* tag also publishes a GitHub release whose text is the matching section of CHANGELOG.md.
name: Build installer
on:
  workflow_dispatch:
  # Disabled for now: pushing a v* tag does NOT start the build/release.
  # Uncomment the two lines below to re-enable it (the check and release jobs only run for tags).
  # push:
  #   tags: ['v*']

jobs:
  # Only for tags: the tag must match package.json and CHANGELOG.md must have a section for it.
  check:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag matches package.json
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match the version in package.json"; exit 1; }
      - name: CHANGELOG.md has notes for this version
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > /dev/null

  build:
    needs: check
    if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: ubuntu-22.04
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: npm ci
      - run: npm test
      - run: npm run tauri build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: toodly-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: toodly-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: toodly ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/**/*
