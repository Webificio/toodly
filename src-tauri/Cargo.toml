[package]
name = "toodly"
version = "1.0.0"
authors = ["Alessandro Di Michele <info@atlantide-design.it>"]
description = "Toodly - gestione task personali"
license = "MIT"
repository = "https://github.com/atlantidezign/toodly"
homepage = "https://github.com/atlantidezign/toodly"
keywords = ["todo", "tasks", "tauri", "desktop"]
edition = "2021"

[lib]
name = "toodly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
